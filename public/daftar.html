<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar, TechnoParts</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="masuk.mjs"></script>
</head>
<body class="latar">
  <header class="kepala">
    <div class="wadah kepala-atas">
      <a class="logo" href="/"><img src="logo.svg" alt="" width="44" height="32">TechnoParts</a>
      <a class="kelola" href="/">Kembali ke toko</a>
    </div>
  </header>

  <main class="wadah">
    <form class="kotak akses" data-tujuan="/auth/daftar">
      <h1>Daftar</h1>
      <label>Nama
        <input name="nama" required maxlength="100" autocomplete="name">
      </label>
      <label>Email
        <input name="email" type="email" required maxlength="254" autocomplete="username">
      </label>
      <label>Kata sandi (minimal 8 karakter)
        <input name="kata_sandi" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
      </label>
      <ul class="salah" role="alert"></ul>
      <button class="tombol">Daftar</button>
      <p>Sudah punya akun? <a href="masuk.html">Masuk</a></p>
    </form>
  </main>
</body>
</html>
